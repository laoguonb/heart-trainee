<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心动练习生：与小鹿的聊天记录</title>
<style>
  :root {
    --bg: #1a1a2e; --chat-bg: #0f0f1a;
    --bubble-me: #7B4FBF; --bubble-you: #2a2540;
    --accent: #C9A0DC; --accent2: #FF6B9D;
    --star: #FFD700; --text: #e8e8e8; --text-dim: #8888a0;
    --divider: #2a2a3a; --online: #4CAF50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #000; display: flex; justify-content: center; align-items: center;
    min-height: 100vh; user-select: none; -webkit-tap-highlight-color: transparent;
  }

  .phone {
    width: 430px; height: 820px; background: var(--bg);
    border-radius: 28px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 3px #1a1a2e, 0 0 0 6px #2a2a3e, 0 20px 60px rgba(0,0,0,0.6);
  }

  .status-bar {
    height: 36px; background: #0a0a14; display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px; font-size: 11px; color: #ccc;
  }
  .status-bar .time { font-weight: 600; }

  .screen { height: calc(100% - 36px); display: flex; flex-direction: column; position: relative; overflow: hidden; }

  .page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; background: var(--bg); }
  .page.active { display: flex; }

  /* 聊天页 */
  .chat-header {
    background: #0a0a14; padding: 10px 16px; display: flex; align-items: center;
    gap: 10px; border-bottom: 1px solid var(--divider); z-index: 5;
  }
  .chat-header .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #C9A0DC, #8B6BAE);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .chat-header .info { flex: 1; }
  .chat-header .name { font-size: 15px; font-weight: 600; color: #fff; }
  .chat-header .status { font-size: 11px; color: var(--online); display: flex; align-items: center; gap: 4px; }
  .chat-header .status::before { content: ''; width: 6px; height: 6px; background: var(--online); border-radius: 50%; }

  /* 好感条——移至聊天区域内，更醒目 */
  .affection-bar {
    margin: 0 14px; padding: 8px 12px;
    background: linear-gradient(135deg, rgba(255,107,157,0.08), rgba(255,64,129,0.04));
    border-radius: 10px; display: flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,107,157,0.2);
  }
  .affection-bar .aff-label { font-size: 11px; color: var(--accent2); letter-spacing: 1px; white-space: nowrap; }
  .affection-bar .hearts-display { font-size: 16px; letter-spacing: 2px; }
  .affection-bar .aff-track {
    flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
  }
  .affection-bar .aff-fill {
    height: 100%; background: linear-gradient(90deg, #FF9AB2, #FF6B9D, #FF4081);
    border-radius: 3px; transition: width 0.5s ease; box-shadow: 0 0 6px rgba(255,107,157,0.4);
  }
  .affection-bar .aff-num { font-size: 11px; color: var(--accent2); font-weight: 700; min-width: 22px; text-align: right; }

  .chat-body {
    flex: 1; overflow-y: auto; padding: 12px 14px; background: var(--chat-bg);
    display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
  }
  .chat-body::-webkit-scrollbar { width: 3px; }
  .chat-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .time-stamp { text-align: center; font-size: 10px; color: #555; padding: 6px 0; }

  .msg { display: flex; flex-direction: column; max-width: 78%; animation: msgIn 0.35s ease-out; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.mine { align-self: flex-end; }
  .msg.theirs { align-self: flex-start; }

  .bubble {
    padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.55;
    position: relative; word-break: break-word;
  }
  .msg.mine .bubble { background: var(--bubble-me); color: #fff; border-bottom-right-radius: 4px; }
  .msg.theirs .bubble { background: var(--bubble-you); color: #e0dce8; border-bottom-left-radius: 4px; }

  .bubble.voice {
    display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 100px;
  }
  .bubble.voice .wave { display: flex; align-items: flex-end; gap: 2px; height: 20px; flex: 1; }
  .bubble.voice .wave span { width: 3px; background: var(--accent); border-radius: 2px; animation: waveAnim 0.8s ease-in-out infinite; }
  .bubble.voice .wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .bubble.voice .wave span:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .bubble.voice .wave span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
  .bubble.voice .wave span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
  .bubble.voice .wave span:nth-child(5) { height: 6px; animation-delay: 0.4s; }
  .bubble.voice .wave span:nth-child(6) { height: 14px; animation-delay: 0.5s; }
  .bubble.voice .wave span:nth-child(7) { height: 9px; animation-delay: 0.6s; }
  @keyframes waveAnim { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }
  .bubble.voice .dur { font-size: 10px; color: #999; margin-left: 4px; }

  .bubble.photo { padding: 4px; background: transparent; overflow: hidden; border-radius: 12px; }
  .bubble.photo .photo-inner {
    width: 180px; height: 120px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    background: linear-gradient(135deg, #1a1a3e, #2a2a5e); position: relative;
  }
  .bubble.photo .photo-inner .caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    font-size: 10px; color: #ccc; padding: 4px 8px; background: rgba(0,0,0,0.5); text-align: center;
  }

  .typing-indicator {
    align-self: flex-start; padding: 12px 18px; background: var(--bubble-you);
    border-radius: 18px; border-bottom-left-radius: 4px; display: none; gap: 4px; align-items: center;
  }
  .typing-indicator.show { display: flex; }
  .typing-indicator span {
    width: 7px; height: 7px; background: #777; border-radius: 50%;
    animation: typingBounce 1.4s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

  .choices-bar {
    padding: 10px 14px; background: #0a0a14; border-top: 1px solid var(--divider);
    display: flex; flex-wrap: wrap; gap: 7px; z-index: 5;
  }
  .choice-chip {
    background: rgba(201,160,220,0.12); border: 1px solid rgba(201,160,220,0.3);
    color: #ccc; padding: 9px 14px; border-radius: 18px; font-size: 13px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .choice-chip:hover {
    background: rgba(201,160,220,0.25); border-color: var(--accent);
    color: #fff; transform: translateY(-1px);
  }

  .tab-bar {
    height: 58px; background: #0a0a14; display: flex; align-items: center;
    justify-content: space-around; border-top: 1px solid var(--divider); z-index: 10;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #555; cursor: pointer; padding: 4px 12px;
    transition: all 0.2s; background: none; border: none; font-family: inherit;
  }
  .tab-item .tab-icon { font-size: 20px; }
  .tab-item.active { color: var(--tab-active); }

  /* 动态页 */
  .moments-header {
    background: #0a0a14; padding: 14px 16px; font-size: 16px; font-weight: 700;
    color: #fff; letter-spacing: 2px; border-bottom: 1px solid var(--divider);
  }
  .moments-body { flex: 1; overflow-y: auto; padding: 12px; background: var(--chat-bg); }
  .moment-card {
    background: #14142a; border-radius: 14px; padding: 14px; margin-bottom: 14px;
    border: 1px solid var(--divider);
  }
  .moment-card .moment-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .moment-card .moment-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #C9A0DC, #8B6BAE);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .moment-card .moment-name { font-size: 14px; font-weight: 600; color: #fff; }
  .moment-card .moment-time { font-size: 10px; color: #666; }
  .moment-card .moment-text { font-size: 13px; color: #ccc; line-height: 1.7; margin-bottom: 8px; }
  .moment-card .moment-photo {
    width: 100%; height: 180px; border-radius: 10px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 50px;
    background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
  }
  .moment-card .moment-actions {
    display: flex; gap: 16px; font-size: 11px; color: #666; margin-bottom: 6px;
  }
  .interact-btn {
    background: none; border: none; color: #888; font-size: 12px; cursor: pointer;
    font-family: inherit; padding: 4px 8px; transition: color 0.2s;
  }
  .interact-btn:hover { color: var(--accent); }
  .interact-btn.liked { color: var(--accent2); }
  .interact-btn.commented { color: var(--accent); }

  /* 评论区 */
  .moment-comments {
    border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; margin-top: 4px;
  }
  .moment-comment {
    display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; font-size: 12px;
  }
  .moment-comment .comment-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .moment-comment .comment-avatar.me {
    background: rgba(255,107,157,0.2);
  }
  .moment-comment .comment-avatar.hero {
    background: linear-gradient(135deg, rgba(201,160,220,0.3), rgba(139,107,174,0.3));
  }
  .moment-comment .comment-body {
    background: rgba(255,255,255,0.04); border-radius: 8px; padding: 6px 10px;
    color: #ccc; line-height: 1.5; flex: 1;
  }
  .comment-choice {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
  }
  .comment-chip {
    background: rgba(201,160,220,0.08); border: 1px solid rgba(201,160,220,0.2);
    color: #aaa; padding: 4px 10px; border-radius: 12px; font-size: 11px;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .comment-chip:hover { background: rgba(201,160,220,0.2); border-color: var(--accent); color: #fff; }

  /* 记忆页 */
  .memory-header {
    background: #0a0a14; padding: 14px 16px; font-size: 16px; font-weight: 700;
    color: #fff; letter-spacing: 2px; border-bottom: 1px solid var(--divider);
  }
  .memory-body { flex: 1; overflow-y: auto; padding: 12px; background: var(--chat-bg); }
  .memory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .memory-item {
    background: #14142a; border-radius: 12px; padding: 14px; text-align: center;
    border: 1px solid var(--divider); cursor: pointer; transition: all 0.2s;
  }
  .memory-item:hover { border-color: var(--accent); }
  .memory-item .mem-icon { font-size: 36px; margin-bottom: 6px; }
  .memory-item .mem-title { font-size: 12px; color: #ccc; letter-spacing: 1px; }
  .memory-item.locked { opacity: 0.3; pointer-events: none; }
  .memory-item.locked .mem-icon { filter: grayscale(1); }
  .memory-item.locked .mem-title { color: #555; }

  /* 来电覆盖层 */
  .call-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3e 100%);
    z-index: 50; display: none; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 80px; gap: 14px;
  }
  .call-overlay.show { display: flex; }
  .call-overlay .call-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, #C9A0DC, #8B6BAE);
    display: flex; align-items: center; justify-content: center; font-size: 44px;
    animation: callPulse 2s ease-in-out infinite;
  }
  @keyframes callPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(201,160,220,0.4); } 50% { box-shadow: 0 0 0 18px rgba(201,160,220,0); } }
  .call-overlay .call-name { font-size: 20px; color: #fff; font-weight: 700; letter-spacing: 2px; }
  .call-overlay .call-status { font-size: 12px; color: #888; }
  .call-overlay .call-duration { font-size: 15px; color: #ccc; letter-spacing: 2px; display: none; }

  /* 来电对话区 */
  .call-dialogue {
    flex: 1; width: 100%; overflow-y: auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 10px; max-height: 240px;
  }
  .call-msg { font-size: 14px; color: #ccc; line-height: 1.7; text-align: center; padding: 8px 16px; }
  .call-msg.hero { color: #C9A0DC; font-style: italic; }
  .call-msg.kr { font-size: 15px; font-weight: 600; letter-spacing: 1px; }

  .call-choices {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 8px 20px 20px;
  }
  .call-choice {
    background: rgba(201,160,220,0.12); border: 1px solid rgba(201,160,220,0.3);
    color: #ccc; padding: 8px 14px; border-radius: 16px; font-size: 13px;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .call-choice:hover { background: rgba(201,160,220,0.25); border-color: var(--accent); color: #fff; }

  .call-btn-row { display: flex; gap: 30px; padding-bottom: 20px; }
  .call-btn {
    width: 52px; height: 52px; border-radius: 50%; border: none;
    font-size: 22px; cursor: pointer; transition: all 0.2s;
  }
  .call-btn.accept { background: #4CAF50; color: white; }
  .call-btn.accept:hover { transform: scale(1.1); }
  .call-btn.decline, .call-btn.end { background: #E53935; color: white; }

  .toast {
    position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); border: 1px solid var(--accent);
    color: var(--accent); padding: 8px 20px; border-radius: 20px;
    font-size: 12px; letter-spacing: 1px; z-index: 99; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  .ending-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9); z-index: 60; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 40px; text-align: center;
  }
  .ending-overlay.show { display: flex; }
  .ending-overlay .ending-badge { font-size: 13px; color: var(--star); letter-spacing: 4px; padding: 6px 20px; border: 1px solid var(--star); border-radius: 20px; }
  .ending-overlay .ending-title { font-size: 26px; color: #fff; font-weight: 700; letter-spacing: 3px; }
  .ending-overlay .ending-text { font-size: 14px; color: #aaa; line-height: 1.8; max-width: 300px; }
  .ending-overlay .ending-stat { font-size: 13px; color: var(--accent2); letter-spacing: 2px; }

  @media (max-width: 450px) { .phone { width: 100vw; height: 100vh; border-radius: 0; } }
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgMusic" src="./Go_Big_or_Go_Home.mp3" loop preload="auto"></audio>
<audio id="ringtone" src="./Once_Upon_a_Time.mp3" preload="auto"></audio>

<div class="phone" id="phone">
  <div class="status-bar"><span class="time" id="statusTime">21:47</span><span>WiFi 🔋</span></div>
  <div class="screen">
    <!-- 聊天页 -->
    <div class="page active" id="chatPage">
      <div class="chat-header">
        <div class="avatar">🦌</div>
        <div class="info"><div class="name">小鹿 🦌</div><div class="status" id="onlineStatus">在线</div></div>
        <span style="font-size:18px;cursor:pointer;padding:4px;" onclick="toggleMusic()" title="开关音乐">🎵</span>
      </div>
      <!-- 好感条——独立一行，更醒目 -->
      <div class="affection-bar">
        <span class="aff-label">💜 好感度</span>
        <span class="hearts-display" id="heartsDisplay">🤍🤍🤍🤍🤍</span>
        <div class="aff-track"><div class="aff-fill" id="affFill" style="width:0%"></div></div>
        <span class="aff-num" id="affNum">0</span>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>
      <div class="choices-bar" id="choicesBar"></div>
    </div>

    <!-- 动态页 -->
    <div class="page" id="momentsPage">
      <div class="moments-header">🦌 小鹿的动态</div>
      <div class="moments-body" id="momentsBody"></div>
    </div>

    <!-- 记忆页 -->
    <div class="page" id="memoryPage">
      <div class="memory-header">💜 我们的记忆</div>
      <div class="memory-body"><div class="memory-grid" id="memoryGrid"></div></div>
    </div>

    <!-- 来电 -->
    <div class="call-overlay" id="callOverlay">
      <div class="call-avatar">🦌</div>
      <div class="call-name">小鹿 🦌</div>
      <div class="call-status" id="callStatus">邀请你语音通话...</div>
      <div class="call-duration" id="callDuration">00:00</div>
      <div class="call-dialogue" id="callDialogue"></div>
      <div class="call-choices" id="callChoices"></div>
      <div class="call-btn-row" id="callBtns">
        <button class="call-btn accept" onclick="acceptCall()">📞</button>
        <button class="call-btn decline" onclick="declineCall()">📴</button>
      </div>
    </div>

    <div class="ending-overlay" id="endingOverlay">
      <div class="ending-badge" id="endingBadge"></div>
      <div class="ending-title" id="endingTitle"></div>
      <div class="ending-text" id="endingText"></div>
      <div class="ending-stat" id="endingStat"></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('chat')" id="tabChat"><span class="tab-icon">💬</span>聊天</button>
      <button class="tab-item" onclick="switchTab('moments')" id="tabMoments"><span class="tab-icon">🌟</span>动态</button>
      <button class="tab-item" onclick="switchTab('memory')" id="tabMemory"><span class="tab-icon">💜</span>记忆</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  心动练习生 — 引擎 v3
// ============================================================
const S = {
  affection: 0, chapter: 0, flags: {},
  playerName: '马鸿诚', heroName: '小鹿',
  callActive: false, callTimer: null, callSec: 0,
  memories: {},
};
const $ = id => document.getElementById(id);

function scrollChat() { setTimeout(() => { const b=$('chatBody'); b.scrollTop=b.scrollHeight; }, 80); }
function scrollCall() { setTimeout(() => { const d=$('callDialogue'); d.scrollTop=d.scrollHeight; }, 80); }

function updateAffection(delta) {
  S.affection = Math.max(0, Math.min(100, S.affection + delta));
  const h = Math.round(S.affection / 20);
  const arr = ['🤍','🤍','🤍','🤍','🤍'];
  for (let i=0;i<h;i++) arr[i]='❤️';
  $('heartsDisplay').textContent = arr.join('');
  $('affFill').style.width = S.affection+'%';
  $('affNum').textContent = S.affection;
}

function showToast(t) { const x=$('toast'); x.textContent=t; x.classList.add('show'); setTimeout(()=>x.classList.remove('show'),1800); }

function showTyping(ms=1200) {
  return new Promise(r=>{
    $('typingIndicator').classList.add('show'); scrollChat();
    setTimeout(()=>{ $('typingIndicator').classList.remove('show'); r(); }, ms);
  });
}

// —— 消息 ——
function addTimeStamp(t) { const d=document.createElement('div'); d.className='time-stamp'; d.textContent=t; $('chatBody').appendChild(d); scrollChat(); }
function addMsg(who, text, opts={}) {
  const c=document.createElement('div'); c.className='msg '+(who==='me'?'mine':'theirs');
  const b=document.createElement('div'); b.className='bubble';
  if (opts.voice) {
    b.classList.add('voice'); const w=document.createElement('div'); w.className='wave';
    for(let i=0;i<7;i++){const s=document.createElement('span');w.appendChild(s);}
    b.appendChild(w); const d=document.createElement('span'); d.className='dur'; d.textContent=opts.dur||'0:12'; b.appendChild(d);
  } else if (opts.photo) {
    b.classList.add('photo'); const i=document.createElement('div'); i.className='photo-inner';
    i.innerHTML=opts.photoEmoji||'🖼️';
    if(opts.caption){const cap=document.createElement('div');cap.className='caption';cap.textContent=opts.caption;i.appendChild(cap);}
    b.appendChild(i);
  } else { b.textContent=text; }
  c.appendChild(b); $('chatBody').appendChild(c); scrollChat();
}

function clearChoices() { $('choicesBar').innerHTML=''; }
function addChoice(label, action) {
  const btn=document.createElement('button'); btn.className='choice-chip';
  btn.textContent=label;
  btn.addEventListener('click',()=>{
    clearChoices(); addMsg('me',label); action();
  });
  $('choicesBar').appendChild(btn);
}

// —— Tab ——
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));

// ========== 音乐控制（增强版——防卡顿断播） ==========
const bgMusic = document.getElementById('bgMusic');
const ringtone = document.getElementById('ringtone');
let musicEnabled = true;
let bgmShouldPlay = false;
let ringtoneShouldPlay = false;
let musicHeartbeat = null;

// 心跳监控：每2秒检查音乐是否还在播，断了就补
function startHeartbeat() {
  if (musicHeartbeat) return;
  musicHeartbeat = setInterval(() => {
    if (bgmShouldPlay && bgMusic.paused && musicEnabled) {
      bgMusic.play().catch(() => {});
    }
    if (ringtoneShouldPlay && ringtone.paused && musicEnabled) {
      ringtone.play().catch(() => {});
    }
  }, 2000);
}

// 预加载音频，确保缓冲足够
function preloadAudio(audio) {
  if (audio.readyState >= 3) return; // 已经够了
  audio.load();
  audio.preload = 'auto';
}

function startBGM() {
  if (!musicEnabled) return;
  bgmShouldPlay = true;
  ringtoneShouldPlay = false;
  preloadAudio(bgMusic);
  bgMusic.volume = 0.25;
  // 从之前的位置继续，不要每次都从头来
  bgMusic.play().catch(() => {
    // 浏览器拦截了自动播放，等用户点击后补播
    document.addEventListener('click', function retry() {
      if (bgmShouldPlay) bgMusic.play().catch(() => {});
    }, { once: true });
  });
  startHeartbeat();
}

function stopBGM() {
  bgmShouldPlay = false;
  bgMusic.pause();
}

function playRingtone() {
  if (!musicEnabled) return;
  stopBGM();
  ringtoneShouldPlay = true;
  preloadAudio(ringtone);
  ringtone.volume = 0.6;
  ringtone.currentTime = 0;
  ringtone.play().catch(() => {});
  startHeartbeat();
}

function stopRingtone() {
  ringtoneShouldPlay = false;
  ringtone.pause();
  ringtone.currentTime = 0;
}

function resumeBGM() {
  stopRingtone();
  if (!musicEnabled) return;
  bgmShouldPlay = true;
  bgMusic.play().catch(() => {});
}

function playEndingMusic() {
  stopBGM();
  stopRingtone();
  if (!musicEnabled) return;
  ringtoneShouldPlay = true;
  preloadAudio(ringtone);
  ringtone.volume = 0.5;
  ringtone.currentTime = 0;
  ringtone.play().catch(() => {});
  startHeartbeat();
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  if (musicEnabled) {
    if (S.callActive) playRingtone();
    else { bgmShouldPlay = true; bgMusic.play().catch(() => {}); }
    showToast('🔊 音乐已开启');
  } else {
    bgmShouldPlay = false;
    ringtoneShouldPlay = false;
    stopBGM();
    stopRingtone();
    showToast('🔇 音乐已关闭');
  }
}

let callResolve=null, callStage=0;

}

function acceptCall(context) {
  stopRingtone();

  startCallDialogue(context);
}
