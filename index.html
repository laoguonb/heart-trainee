<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>心动练习生</title>
<base href="https://cdn.jsdelivr.net/gh/laoguonb/heart-trainee@master/">
<style>body{margin:0;background:#1a1a2e}#L{color:#fff;text-align:center;padding-top:40vh;font-size:18px;font-family:sans-serif;background:#1a1a2e;position:fixed;inset:0;z-index:9999}</style>
<script>
(async()=>{
try{
let r=await fetch("game.html");
let h=await r.text();
document.getElementById("L").remove();
document.write(h);
document.close();
}catch(e){
document.getElementById("L").innerHTML="🦌 加载失败<br><span style='font-size:13px;color:#888'>请检查网络后刷新</span>";
}
})()
</script>
</head><body><div id="L">🦌 心动练习生<br><span style="font-size:13px;color:#888">加载中...</span></div></body></html>
